<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="VCut Studio logo">
  <!--
    VCut Studio — logo gốc (tự vẽ, MIT, tài sản của dự án).
    Motif: khung phim bo góc (editor) + tam giác phát (play) cắt thành chữ V.
    Màu: tím violet chính #7C3AED → cyan điểm nhấn #22D3EE.
  -->
  <defs>
    <linearGradient id="vcut-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Khung phim -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="url(#vcut-grad)"/>

  <!-- Đường cắt timeline (gợi ý track) -->
  <rect x="20" y="103" width="200" height="6" fill="#0F0F14" opacity="0.18"/>
  <rect x="20" y="131" width="200" height="6" fill="#0F0F14" opacity="0.18"/>

  <!-- Tam giác phát tạo hình chữ V -->
  <path d="M 92 66 L 164 120 L 92 174 Z" fill="#F5F3FF"/>
  <path d="M 92 66 L 120 120 L 92 174 Z" fill="#22D3EE" opacity="0.85"/>

  <!-- Wordmark -->
  <text x="120" y="232" text-anchor="middle" font-family="Be Vietnam Pro, Segoe UI, sans-serif" font-size="0" fill="#0F0F14"></text>
</svg>
